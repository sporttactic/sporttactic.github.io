  Standalone build for older iPads (2010, iOS 3-6 Safari) and other legacy
  browsers. index.html redirects here automatically when the device cannot run
  the modern app; ?full=1 on index.html overrides that for good.
  ES5 only: no const/let, arrow functions, template literals, classes,
  IndexedDB, MediaRecorder, fetch or requestAnimationFrame. Uses var,

<style>
  * { -webkit-box-sizing: border-box; box-sizing: border-box; }

  .b.wide { min-width: 66px; }
  .sw { width: 34px; min-width: 34px; height: 34px; padding: 0; border-radius: 50%; }
  select.b { padding: 9px 8px; }
  #wrap { text-align: center; padding: 8px 6px 20px; }
  canvas {
    width: 100%; max-width: 720px; height: auto; background: #0b1220;
    border: 1px solid #1f2937; border-radius: 10px; -ms-touch-action: none; touch-action: none;
  }
  #snap { margin-top: 10px; }
  #snap img { max-width: 100%; border: 1px solid #334155; border-radius: 8px; }
  #snap p { font-size: 12px; color: #94a3b8; }

  /* ---- Classic shell: tab bar + the non-board modules ---- */

  .head .topline .full { float: right; margin-top: 4px; }

  .tabs { background: #111827; border-bottom: 1px solid #1f2937; padding: 5px 4px; white-space: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tab { display: inline-block; margin: 2px; padding: 10px 13px; background: #1f2937; border: 1px solid #334155; border-radius: 8px; font-size: 15px; color: #e5e7eb; line-height: 20px; }
  .tab.on { background: #0a84ff; border-color: #0a84ff; color: #fff; }
  .view { display: none; }
  .view.on { display: block; }
  .card { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 10px 12px; margin: 8px; }
  .card h2 { margin: 0 0 6px; font-size: 16px; }
  .card h3 { margin: 10px 0 4px; font-size: 13px; color: #cbd5e1; }
  .hint { font-size: 12px; color: #94a3b8; margin: 2px 0 8px; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }

  .f input, .f select, .f textarea {
    width: 100%; padding: 9px 8px; background: #0b1220; color: #e5e7eb;

  }
  .frow { margin: 0 -4px; }

  .tag.g { border-color: #16a34a; color: #86efac; }
  .tag.r { border-color: #dc2626; color: #fca5a5; }
  .tag.a { border-color: #d97706; color: #fcd34d; }
  .log { max-height: 220px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #clock { font-size: 22px; font-weight: bold; display: inline-block; min-width: 74px; }
  textarea#dataBox { height: 190px; font-size: 12px; font-family: Courier, monospace; }
  /* iPad landscape (1024) gets two columns; portrait (768) stays single. */
  @media (min-width: 820px) {
    .f.half { width: 50%; }
    .f.third { width: 33.33%; }
    .kpi { width: 25%; }
    .cols { margin: 0 -4px; overflow: hidden; }
    .cols .col { float: left; width: 50%; padding: 0 4px; }
  }
  @media print {
    .head, .tabs, .acts, .b, .tab { display: none !important; }
    body { background: #fff; color: #000; }
    .card { border: 1px solid #999; background: #fff; color: #000; page-break-inside: avoid; }
    .tbl th, .tbl td { border-bottom: 1px solid #ccc; color: #000; }
  }
</style>

<script>
(function () {
  var W = 700, H = 560;
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');

  var ATK = '#0a84ff', DEF = '#ff3b30', GK = '#f59e0b', BALL = '#ffd60a';

  // ---------- geometry helpers ----------
  function clamp(v) { return v < 0 ? 0 : (v > 100 ? 100 : v); }
  function PX(x) { return x / 100 * W; }
  function PY(y) { return y / 100 * H; }
  function lerpAngle(a, b, t) {
    var d = b - a;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return a + d * t;
  }
  function distSeg(px, py, x1, y1, x2, y2) {
    var dx = x2 - x1, dy = y2 - y1;
    var L = dx * dx + dy * dy;
    var t = L ? ((px - x1) * dx + (py - y1) * dy) / L : 0;
    if (t < 0) t = 0; else if (t > 1) t = 1;
    var cx = x1 + t * dx, cy = y1 + t * dy;
    return Math.sqrt((px - cx) * (px - cx) + (py - cy) * (py - cy));
  }
  function cloneShallow(o) {
    var n = {}, k;
    for (k in o) { if (o.hasOwnProperty(k)) n[k] = o[k]; }
    return n;
  }

  // Build the points of a handball "D" (6m/9m) area in pixel space:
  // a quarter circle at each goal post joined by a flat top line.
  function dPoints(goalY, dir, postHalf, R) {
    var lp = W / 2 - postHalf, rp = W / 2 + postHalf, a, pts = [];
    for (a = 180; a >= 90; a -= 6) {
      pts.push({ x: lp + R * Math.cos(a * Math.PI / 180), y: goalY + dir * R * Math.sin(a * Math.PI / 180) });
    }
    pts.push({ x: rp, y: goalY + dir * R });
    for (a = 90; a >= 0; a -= 6) {
      pts.push({ x: rp + R * Math.cos(a * Math.PI / 180), y: goalY + dir * R * Math.sin(a * Math.PI / 180) });
    }
    return pts;
  }
  function fillD(goalY, dir, postHalf, R, fill, stroke) {
    var pts = dPoints(goalY, dir, postHalf, R), i;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
  }
  // Dashed stroke along an open polyline (old Safari has no setLineDash).
  function dashPoly(pts, dash, gap) {
    var i, carry = 0, on = true;
    ctx.beginPath();
    for (i = 0; i < pts.length - 1; i++) {
      var x1 = pts[i].x, y1 = pts[i].y, x2 = pts[i + 1].x, y2 = pts[i + 1].y;
      var segLen = Math.sqrt((x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1));
      var ux = (x2 - x1) / segLen, uy = (y2 - y1) / segLen, pos = 0;
      var cx = x1, cy = y1;
      while (pos < segLen) {
        var step = (on ? dash : gap) - carry;
        if (step > segLen - pos) { carry += (segLen - pos); step = segLen - pos; pos = segLen; }
        else { pos += step; carry = 0; }
        var nx = cx + ux * step, ny = cy + uy * step;
        if (on) { ctx.moveTo(cx, cy); ctx.lineTo(nx, ny); }
        cx = nx; cy = ny;
        if (carry === 0) on = !on;
      }
    }
    ctx.stroke();
  }

  // ---------- court renderers ----------
  function border() {
    ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 2;
    ctx.strokeRect(8, 8, W - 16, H - 16);
  }
  function centerLine() {
    ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(8, H / 2); ctx.lineTo(W - 8, H / 2); ctx.stroke();
  }
  function circle(cx, cy, r) {
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2, false); ctx.stroke();
  }
  function goal(goalY, dir, postHalf) {
    ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 3;
    ctx.strokeRect(W / 2 - postHalf, goalY - (dir > 0 ? 0 : 6), postHalf * 2, 6);
  }

  function courtHandball() {
    ctx.fillStyle = '#215d8c'; ctx.fillRect(0, 0, W, H);
    border(); centerLine();
    var postHalf = 35, R6 = 132, R9 = 178;
    var gTop = 14, gBot = H - 14;
    fillD(gTop, 1, postHalf, R6, 'rgba(255,255,255,0.10)', '#e5e7eb');
    fillD(gBot, -1, postHalf, R6, 'rgba(255,255,255,0.10)', '#e5e7eb');
    ctx.strokeStyle = '#dbeafe'; ctx.lineWidth = 2;
    dashPoly(dPoints(gTop, 1, postHalf, R9), 10, 8);
    dashPoly(dPoints(gBot, -1, postHalf, R9), 10, 8);
    // 7 m marks
    ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(W / 2 - 18, gTop + 150); ctx.lineTo(W / 2 + 18, gTop + 150);
    ctx.moveTo(W / 2 - 18, gBot - 150); ctx.lineTo(W / 2 + 18, gBot - 150); ctx.stroke();
    goal(gTop, 1, postHalf); goal(gBot, -1, postHalf);
  }

  function courtSoccer() {
    ctx.fillStyle = '#2f8f4e'; ctx.fillRect(0, 0, W, H);
    border(); centerLine();
    ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 2;
    circle(W / 2, H / 2, 62);
    ctx.fillStyle = '#e5e7eb';
    ctx.beginPath(); ctx.arc(W / 2, H / 2, 4, 0, Math.PI * 2, false); ctx.fill();
    // penalty boxes
    var bw = 300, bh = 78, gw = 150, gh = 34;
    ctx.strokeRect(W / 2 - bw / 2, 8, bw, bh);
    ctx.strokeRect(W / 2 - gw / 2, 8, gw, gh);
    ctx.strokeRect(W / 2 - bw / 2, H - 8 - bh, bw, bh);
    ctx.strokeRect(W / 2 - gw / 2, H - 8 - gh, gw, gh);
    ctx.beginPath(); ctx.arc(W / 2, 8 + 100, 4, 0, Math.PI * 2, false);
    ctx.arc(W / 2, H - 8 - 100, 4, 0, Math.PI * 2, false); ctx.fill();
  }

  function courtBasket() {
    ctx.fillStyle = '#c8843c'; ctx.fillRect(0, 0, W, H);
    border(); centerLine();
    ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 2;
    circle(W / 2, H / 2, 52);
    // keys + free-throw circles + three point arcs
    var kw = 120, kh = 150;
    ctx.strokeRect(W / 2 - kw / 2, 8, kw, kh);
    circle(W / 2, 8 + kh, 40);
    ctx.strokeRect(W / 2 - kw / 2, H - 8 - kh, kw, kh);
    circle(W / 2, H - 8 - kh, 40);
    ctx.beginPath(); ctx.arc(W / 2, 34, 200, 0.15 * Math.PI, 0.85 * Math.PI, false); ctx.stroke();
    ctx.beginPath(); ctx.arc(W / 2, H - 34, 200, 1.15 * Math.PI, 1.85 * Math.PI, false); ctx.stroke();
  }

  function courtVolley() {
    ctx.fillStyle = '#d98c3f'; ctx.fillRect(0, 0, W, H);
    border();
    ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(8, H / 2); ctx.lineTo(W - 8, H / 2); ctx.stroke();
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(8, H / 2 - 90); ctx.lineTo(W - 8, H / 2 - 90);
    ctx.moveTo(8, H / 2 + 90); ctx.lineTo(W - 8, H / 2 + 90);
    ctx.stroke();
  }

  function courtGeneric() {
    ctx.fillStyle = '#1e293b'; ctx.fillRect(0, 0, W, H);
    border(); centerLine();
    ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 2;
    circle(W / 2, H / 2, 56);
  }

  // ---------- sport definitions ----------
  function mk(id, t, team, label, x, y, rot) {
    var o = { id: id, t: t, team: team, label: label, x: x, y: y };
    if (typeof rot === 'number') o.rot = rot;
    return o;
  }
  function line(team, base, xs, ys, y) {
    var out = [], i;
    for (i = 0; i < xs.length; i++) out.push(mk(base + i, 'player', team, i + 1, xs[i], y));
    return out;
  }

  var SPORTS = {
    handball: {
      name: 'Handball', court: courtHandball, props: ['cone', 'pole', 'minigoal', 'dummy'],
      formation: function () {
        var o = [], i;
        var def = [[26.44, 14.82, 2.715], [38.37, 26.89, 2.091], [47.57, 28.21, 1.684], [52.43, 28.21, 1.458], [61.63, 26.89, 1.051], [73.56, 14.82, 0.426]];
        var atk = [[17.09, 20.14, -0.426], [33.27, 38.05, -1.051], [46.41, 40.98, -1.458], [53.59, 40.98, -1.684], [66.73, 38.05, -2.091], [82.91, 20.14, -2.715]];
        for (i = 0; i < def.length; i++) o.push(mk('d' + i, 'player', 'def', i + 1, def[i][0], def[i][1], def[i][2]));
        for (i = 0; i < atk.length; i++) o.push(mk('a' + i, 'player', 'atk', i + 1, atk[i][0], atk[i][1], atk[i][2]));
        o.push(mk('gk', 'gk', 'def', 1, 50, 6, Math.PI / 2));
        o.push(mk('ball', 'ball', '', '', 50, 46));
        return o;
      }
    },
    soccer: {
      name: 'Soccer', court: courtSoccer, props: ['cone', 'disc', 'pole', 'minigoal'],
      formation: function () {
        var o = [];
        o.push(mk('gkA', 'gk', 'atk', 1, 50, 90));
        o = o.concat(line('atk', 100, [16, 38, 62, 84], null, 74));
        o = o.concat(line('atk', 200, [22, 42, 58, 78], null, 60));
        o = o.concat(line('atk', 300, [34, 66], null, 52));
        o.push(mk('gkB', 'gk', 'def', 1, 50, 10));
        o = o.concat(line('def', 400, [16, 38, 62, 84], null, 26));
        o = o.concat(line('def', 500, [22, 42, 58, 78], null, 40));
        o = o.concat(line('def', 600, [34, 66], null, 48));
        o.push(mk('ball', 'ball', '', '', 50, 50));
        return o;
      }
    },
    basketball: {
      name: 'Basketball', court: courtBasket, props: ['cone', 'disc', 'ring', 'dummy'],
      formation: function () {
        var o = [];
        o = o.concat(line('atk', 100, [18, 34, 50, 66, 82], null, 66));
        o = o.concat(line('def', 200, [18, 34, 50, 66, 82], null, 34));
        o.push(mk('ball', 'ball', '', '', 50, 50));
        return o;
      }
    },
    volleyball: {
      name: 'Volleyball', court: courtVolley, props: ['cone', 'ring', 'ball', 'pole'],
      formation: function () {
        var o = [];
        o.push(mk('a1', 'player', 'atk', 1, 25, 60)); o.push(mk('a2', 'player', 'atk', 2, 50, 60)); o.push(mk('a3', 'player', 'atk', 3, 75, 60));
        o.push(mk('a4', 'player', 'atk', 4, 25, 82)); o.push(mk('a5', 'player', 'atk', 5, 50, 82)); o.push(mk('a6', 'player', 'atk', 6, 75, 82));
        o.push(mk('d1', 'player', 'def', 1, 25, 40)); o.push(mk('d2', 'player', 'def', 2, 50, 40)); o.push(mk('d3', 'player', 'def', 3, 75, 40));
        o.push(mk('d4', 'player', 'def', 4, 25, 18)); o.push(mk('d5', 'player', 'def', 5, 50, 18)); o.push(mk('d6', 'player', 'def', 6, 75, 18));
        o.push(mk('ball', 'ball', '', '', 50, 30));
        return o;
      }
    },
    generic: {
      name: 'Generic', court: courtGeneric, props: ['cone', 'disc', 'pole', 'ring', 'dummy'],
      formation: function () {
        var o = [];
        o = o.concat(line('atk', 100, [20, 35, 50, 65, 80], null, 68));
        o = o.concat(line('def', 200, [20, 35, 50, 65, 80], null, 32));
        o.push(mk('ball', 'ball', '', '', 50, 50));
        return o;
      }
    }
  };
  var SPORT_ORDER = ['handball', 'soccer', 'basketball', 'volleyball', 'generic'];

  var PROPS = {
    cone: 'Cone', disc: 'Disc', pole: 'Pole', hurdle: 'Hurdle', ladder: 'Ladder',
    ring: 'Ring', minigoal: 'Mini goal', dummy: 'Dummy', ball: 'Med. ball', target: 'Target'
  };

  // ---------- state ----------
  var state = { sport: 'handball', frames: [] };
  var frameIdx = 0;
  var tool = 'select';
  var curTeam = 'atk';
  var curProp = 'cone';
  var curColor = '#ffffff';
  var selectedId = null;
  var addSeq = 1;
  var pending = null;
  var playTimer = null;
  var touching = false, dragging = false;

  function frame() { return state.frames[frameIdx]; }
  function sport() { return SPORTS[state.sport]; }

  function newFrame() { return { objects: sport().formation() }; }
  function blankFrame() { return { objects: [] }; }

  function findById(f, id) {
    var i;
    for (i = 0; i < f.objects.length; i++) if (f.objects[i].id === id) return f.objects[i];
    return null;
  }
  function selected() { return selectedId ? findById(frame(), selectedId) : null; }

  // ---------- object drawing ----------
  function drawFacing(rot, x, y, r) {
    var ex = x + Math.cos(rot) * (r + 12), ey = y + Math.sin(rot) * (r + 12);
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(ex, ey); ctx.stroke();
    var a = 0.5;
    ctx.beginPath();
    ctx.moveTo(ex, ey);
    ctx.lineTo(ex - Math.cos(rot - a) * 9, ey - Math.sin(rot - a) * 9);
    ctx.lineTo(ex - Math.cos(rot + a) * 9, ey - Math.sin(rot + a) * 9);
    ctx.closePath(); ctx.fillStyle = '#ffffff'; ctx.fill();
  }

  function drawPlayer(o) {
    var x = PX(o.x), y = PY(o.y), r = o.t === 'gk' ? 16 : 15;
    if (typeof o.rot === 'number') drawFacing(o.rot, x, y, r);
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2, false);
    ctx.fillStyle = o.t === 'gk' ? GK : (o.team === 'def' ? DEF : ATK);
    ctx.fill();
    if (o.id === selectedId) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke(); }
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px Helvetica';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(o.label), x, y);
  }

  function drawBall(o) {
    var x = PX(o.x), y = PY(o.y);
    ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2, false);
    ctx.fillStyle = BALL; ctx.fill();
    ctx.strokeStyle = '#7a5b00'; ctx.lineWidth = 1.5; ctx.stroke();
    if (o.id === selectedId) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
  }

  function drawProp(o) {
    var x = PX(o.x), y = PY(o.y), p = o.prop;
    ctx.lineWidth = 2;
    if (p === 'cone') {
      ctx.fillStyle = '#ff7a1a';
      ctx.beginPath(); ctx.moveTo(x, y - 13); ctx.lineTo(x - 10, y + 9); ctx.lineTo(x + 10, y + 9); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#0b1220'; ctx.fillRect(x - 12, y + 9, 24, 4);
    } else if (p === 'disc') {
      ctx.fillStyle = '#ffb020';
      ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI * 2, false); ctx.fill();
      ctx.fillStyle = '#0b1220';
      ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2, false); ctx.fill();
    } else if (p === 'pole') {
      ctx.strokeStyle = '#e11d48';
      ctx.beginPath(); ctx.moveTo(x, y - 16); ctx.lineTo(x, y + 12); ctx.stroke();
      ctx.fillStyle = '#e11d48'; ctx.fillRect(x - 8, y + 12, 16, 3);
    } else if (p === 'hurdle') {
      ctx.strokeStyle = '#facc15';
      ctx.strokeRect(x - 12, y - 8, 24, 16);
      ctx.beginPath(); ctx.moveTo(x - 12, y + 8); ctx.lineTo(x - 12, y + 12);
      ctx.moveTo(x + 12, y + 8); ctx.lineTo(x + 12, y + 12); ctx.stroke();
    } else if (p === 'ladder') {
      ctx.strokeStyle = '#eab308';
      ctx.strokeRect(x - 8, y - 16, 16, 32);
      ctx.beginPath();
      ctx.moveTo(x - 8, y - 6); ctx.lineTo(x + 8, y - 6);
      ctx.moveTo(x - 8, y + 4); ctx.lineTo(x + 8, y + 4); ctx.stroke();
    } else if (p === 'ring') {
      ctx.strokeStyle = '#22d3ee'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI * 2, false); ctx.stroke();
    } else if (p === 'minigoal') {
      ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x - 15, y + 8); ctx.lineTo(x - 15, y - 8);
      ctx.lineTo(x + 15, y - 8); ctx.lineTo(x + 15, y + 8); ctx.stroke();
    } else if (p === 'dummy') {
      ctx.fillStyle = '#94a3b8';
      ctx.beginPath(); ctx.arc(x, y - 6, 6, 0, Math.PI * 2, false); ctx.fill();
      ctx.fillRect(x - 5, y, 10, 14);
    } else if (p === 'ball') {
      ctx.fillStyle = '#8b5a2b';
      ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2, false); ctx.fill();
    } else if (p === 'target') {
      ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI * 2, false); ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2, false); ctx.stroke();
      ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2, false); ctx.fill();
    }
    if (o.id === selectedId) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
      ctx.strokeRect(x - 15, y - 18, 30, 34);
    }
  }

  function arrowHead(x1, y1, x2, y2, color) {
    var a = Math.atan2(y2 - y1, x2 - x1);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - Math.cos(a - 0.4) * 12, y2 - Math.sin(a - 0.4) * 12);
    ctx.lineTo(x2 - Math.cos(a + 0.4) * 12, y2 - Math.sin(a + 0.4) * 12);
    ctx.closePath(); ctx.fill();
  }

  function drawShape(o) {
    var i;
    ctx.strokeStyle = o.color; ctx.lineWidth = 3;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (o.t === 'free') {
      if (!o.pts.length) return;
      ctx.beginPath(); ctx.moveTo(PX(o.pts[0].x), PY(o.pts[0].y));
      for (i = 1; i < o.pts.length; i++) ctx.lineTo(PX(o.pts[i].x), PY(o.pts[i].y));
      ctx.stroke();
    } else {
      var x1 = PX(o.x1), y1 = PY(o.y1), x2 = PX(o.x2), y2 = PY(o.y2);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      if (o.t === 'arrow') arrowHead(x1, y1, x2, y2, o.color);
    }
  }

  function drawObject(o) {
    if (o.t === 'player' || o.t === 'gk') drawPlayer(o);
    else if (o.t === 'ball') drawBall(o);
    else if (o.t === 'prop') drawProp(o);
    else drawShape(o);
  }

  function drawCourt() { sport().court(); }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawCourt();
    var objs = frame().objects, i;
    for (i = 0; i < objs.length; i++) if (objs[i].t === 'line' || objs[i].t === 'arrow' || objs[i].t === 'free') drawObject(objs[i]);
    for (i = 0; i < objs.length; i++) if (!(objs[i].t === 'line' || objs[i].t === 'arrow' || objs[i].t === 'free')) drawObject(objs[i]);
    if (pending) drawObject(pending);
  }

  function drawInterp(fa, fb, t) {
    ctx.clearRect(0, 0, W, H);
    drawCourt();
    var i, o, a, oo;
    for (i = 0; i < fb.objects.length; i++) { o = fb.objects[i]; if (o.t === 'line' || o.t === 'arrow' || o.t === 'free') drawObject(o); }
    for (i = 0; i < fb.objects.length; i++) {
      o = fb.objects[i];
      if (o.t === 'line' || o.t === 'arrow' || o.t === 'free') continue;
      a = findById(fa, o.id);
      if (a) {
        oo = cloneShallow(o);
        oo.x = a.x + (o.x - a.x) * t; oo.y = a.y + (o.y - a.y) * t;
        if (typeof o.rot === 'number' && typeof a.rot === 'number') oo.rot = lerpAngle(a.rot, o.rot, t);
      } else oo = o;
      drawObject(oo);
    }
  }

  // ---------- hit testing ----------
  function radiusOf(o) {
    if (o.t === 'gk') return 18; if (o.t === 'player') return 17;
    if (o.t === 'ball') return 12; if (o.t === 'prop') return 18; return 0;
  }
  function hitMovable(pt) {
    var objs = frame().objects, i, o, dx, dy;
    for (i = objs.length - 1; i >= 0; i--) {
      o = objs[i];
      if (o.t === 'line' || o.t === 'arrow' || o.t === 'free') continue;
      dx = PX(o.x) - pt.px; dy = PY(o.y) - pt.py;
      if (Math.sqrt(dx * dx + dy * dy) <= radiusOf(o)) return o;
    }
    return null;
  }
  function hitAny(pt) {
    var m = hitMovable(pt);
    if (m) return m;
    var objs = frame().objects, i, o, j, d;
    for (i = objs.length - 1; i >= 0; i--) {
      o = objs[i];
      if (o.t === 'line' || o.t === 'arrow') {
        d = distSeg(pt.px, pt.py, PX(o.x1), PY(o.y1), PX(o.x2), PY(o.y2));
        if (d <= 10) return o;
      } else if (o.t === 'free') {
        for (j = 0; j < o.pts.length - 1; j++) {
          d = distSeg(pt.px, pt.py, PX(o.pts[j].x), PY(o.pts[j].y), PX(o.pts[j + 1].x), PY(o.pts[j + 1].y));
          if (d <= 10) return o;
        }
      }
    }
    return null;
  }
  function removeObj(o) {
    var objs = frame().objects, i;
    for (i = 0; i < objs.length; i++) if (objs[i] === o) { objs.splice(i, 1); return; }
  }

  // ---------- pointer handling ----------
  function evtXY(e) {
    var rect = cv.getBoundingClientRect(), cx, cy;
    if (e.touches && e.touches.length) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
    else if (e.changedTouches && e.changedTouches.length) { cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY; }
    else { cx = e.clientX; cy = e.clientY; }
    var sx = W / rect.width, sy = H / rect.height;
    var px = (cx - rect.left) * sx, py = (cy - rect.top) * sy;
    return { px: px, py: py, x: px / W * 100, y: py / H * 100 };
  }

  var press = null;

  function onDown(pt) {
    if (playTimer) stopPlay();
    if (tool === 'select') {
      var o = hitMovable(pt);
      if (o) { selectedId = o.id; press = { obj: o, dx: pt.x - o.x, dy: pt.y - o.y }; }
      else { selectedId = null; press = null; }
      updateRot(); draw();
    } else if (tool === 'player') {
      frame().objects.push(mk('u' + (addSeq++), 'player', curTeam, countTeam(curTeam) + 1, clamp(pt.x), clamp(pt.y)));
      draw(); persist();
    } else if (tool === 'prop') {
      frame().objects.push({ id: 'pr' + (addSeq++), t: 'prop', prop: curProp, x: clamp(pt.x), y: clamp(pt.y) });
      draw(); persist();
    } else if (tool === 'erase') {
      var e = hitAny(pt); if (e) { removeObj(e); if (selectedId === e.id) selectedId = null; draw(); persist(); }
    } else if (tool === 'line' || tool === 'arrow') {
      pending = { id: 'ln' + (addSeq++), t: tool, color: curColor, x1: pt.x, y1: pt.y, x2: pt.x, y2: pt.y };
    } else if (tool === 'free') {
      pending = { id: 'fr' + (addSeq++), t: 'free', color: curColor, pts: [{ x: pt.x, y: pt.y }] };
    }
  }

  function onMove(pt) {
    if (press && press.obj) {
      press.obj.x = clamp(pt.x - press.dx); press.obj.y = clamp(pt.y - press.dy);
      draw();
    } else if (pending) {
      if (pending.t === 'free') pending.pts.push({ x: clamp(pt.x), y: clamp(pt.y) });
      else { pending.x2 = clamp(pt.x); pending.y2 = clamp(pt.y); }
      draw();
    }
  }

  function onUp() {
    if (press && press.obj) { press = null; persist(); }
    if (pending) {
      var keep = false;
      if (pending.t === 'free') keep = pending.pts.length > 1;
      else keep = Math.abs(pending.x2 - pending.x1) + Math.abs(pending.y2 - pending.y1) > 1;
      if (keep) frame().objects.push(pending);
      pending = null; draw(); persist();
    }
  }

  function countTeam(team) {
    var objs = frame().objects, n = 0, i;
    for (i = 0; i < objs.length; i++) if (objs[i].t === 'player' && objs[i].team === team) n++;
    return n;
  }

  cv.ontouchstart = function (e) { e.preventDefault(); touching = true; onDown(evtXY(e)); };
  cv.ontouchmove = function (e) { e.preventDefault(); onMove(evtXY(e)); };
  cv.ontouchend = function (e) { e.preventDefault(); onUp(evtXY(e)); };
  cv.onmousedown = function (e) { if (touching) return; dragging = true; onDown(evtXY(e)); };
  cv.onmousemove = function (e) { if (touching || !dragging) return; onMove(evtXY(e)); };
  cv.onmouseup = function (e) { if (touching) { return; } dragging = false; onUp(evtXY(e)); };

  // ---------- rotation ----------
  function rotateSel(delta) {
    var s = selected();
    if (!s || (s.t !== 'player' && s.t !== 'gk')) return;
    s.rot = (typeof s.rot === 'number' ? s.rot : 0) + delta;
    draw(); persist();
  }
  function clearRot() {
    var s = selected();
    if (s && typeof s.rot === 'number') { delete s.rot; draw(); persist(); }
  }

  // ---------- persistence ----------
  function persist() {
    try { localStorage.setItem('oldipads_board', JSON.stringify({ sport: state.sport, frames: state.frames, idx: frameIdx })); } catch (e) { }
  }
  function restore() {
    try {
      var raw = localStorage.getItem('oldipads_board');
      if (!raw) return false;
      var d = JSON.parse(raw);
      if (!d || !d.frames || !d.frames.length || !SPORTS[d.sport]) return false;
      state.sport = d.sport; state.frames = d.frames; frameIdx = d.idx || 0;
      if (frameIdx >= state.frames.length) frameIdx = 0;
      return true;
    } catch (e) { return false; }
  }

  // ---------- playback ----------
  function play() {
    if (state.frames.length < 2) return;
    stopPlay();
    var seg = 0, t = 0, stepMs = 45, durPer = 800;
    playBtn.innerHTML = 'Stop';
    playTimer = setInterval(function () {
      t += stepMs / durPer;
      if (t >= 1) { t = 0; seg++; if (seg >= state.frames.length - 1) { stopPlay(); frameIdx = state.frames.length - 1; draw(); updateFrameInfo(); return; } }
      drawInterp(state.frames[seg], state.frames[seg + 1], t);
    }, stepMs);
  }
  function stopPlay() {
    if (playTimer) { clearInterval(playTimer); playTimer = null; }
    playBtn.innerHTML = 'Play';
  }

  // ---------- UI building ----------
  function btn(label, cls) {
    var b = document.createElement('button');
    b.className = 'b' + (cls ? ' ' + cls : '');
    b.innerHTML = label;
    return b;
  }
  function setActive(container, el) {
    var kids = container.childNodes, i;
    for (i = 0; i < kids.length; i++) if (kids[i].className !== undefined) kids[i].className = kids[i].className.replace(' on', '');
    if (el) el.className += ' on';
  }

  var sportRow = document.getElementById('sportRow');
  var toolRow = document.getElementById('toolRow');
  var teamRow = document.getElementById('teamRow');
  var propRow = document.getElementById('propRow');
  var colorRow = document.getElementById('colorRow');
  var rotRow = document.getElementById('rotRow');
  var frameRow = document.getElementById('frameRow');
  var fileRow = document.getElementById('fileRow');
  var frameInfo, playBtn, propSelect;

  function buildSports() {
    var i, id;
    for (i = 0; i < SPORT_ORDER.length; i++) {
      (function (id) {
        var b = btn(SPORTS[id].name, 'wide');
        if (id === state.sport) b.className += ' on';
        b.onclick = function () {
          if (id === state.sport) return;
          state.sport = id; state.frames = [newFrame()]; frameIdx = 0;
          selectedId = null; stopPlay();
          setActive(sportRow, b);
          buildProps(); updatePropRow(); draw(); updateFrameInfo(); persist();
        };
        sportRow.appendChild(b);
      })(SPORT_ORDER[i]);
    }
  }

  function buildTools() {
    var tools = [['select', 'Select'], ['player', 'Add'], ['prop', 'Prop'], ['line', 'Line'], ['arrow', 'Arrow'], ['free', 'Draw'], ['erase', 'Erase']];
    var i;
    for (i = 0; i < tools.length; i++) {
      (function (t, lbl) {
        var b = btn(lbl);
        if (t === tool) b.className += ' on';
        b.onclick = function () { tool = t; setActive(toolRow, b); updatePropRow(); };
        toolRow.appendChild(b);
      })(tools[i][0], tools[i][1]);
    }
    // team toggle
    var ba = btn('Attack'); ba.className += ' on';
    var bd = btn('Defense', 'red');
    ba.onclick = function () { curTeam = 'atk'; ba.className = 'b on'; bd.className = 'b red'; };
    bd.onclick = function () { curTeam = 'def'; bd.className = 'b red on'; ba.className = 'b'; };
    teamRow.appendChild(document.createTextNode(' Team: '));
    teamRow.appendChild(ba); teamRow.appendChild(bd);
    // colors for drawings
    var cols = ['#ffffff', '#0a84ff', '#ff3b30', '#ffd60a', '#34c759'];
    colorRow.appendChild(document.createTextNode(' Pen: '));
    for (i = 0; i < cols.length; i++) {
      (function (c) {
        var b = btn('', 'sw'); b.style.background = c;
        if (c === curColor) b.className += ' on';
        b.onclick = function () { curColor = c; setActive(colorRow, b); };
        colorRow.appendChild(b);
      })(cols[i]);
    }
  }

  function buildProps() {
    propRow.innerHTML = '';
    propRow.appendChild(document.createTextNode(' Prop: '));
    propSelect = document.createElement('select');
    propSelect.className = 'b';
    var list = sport().props, i;
    for (i = 0; i < list.length; i++) {
      var op = document.createElement('option');
      op.value = list[i]; op.innerHTML = PROPS[list[i]];
      propSelect.appendChild(op);
    }
    curProp = list[0];
    propSelect.onchange = function () { curProp = propSelect.value; };
    propRow.appendChild(propSelect);
  }
  function updatePropRow() {
    propRow.style.display = (tool === 'prop') ? 'block' : 'none';
  }

  function buildRot() {
    var bl = btn('&#8630; Left'); bl.onclick = function () { rotateSel(-Math.PI / 12); };
    var br = btn('Right &#8631;'); br.onclick = function () { rotateSel(Math.PI / 12); };
    var bc = btn('Clear facing'); bc.onclick = function () { clearRot(); };
    rotRow.appendChild(document.createTextNode(' Selected: '));
    rotRow.appendChild(bl); rotRow.appendChild(br); rotRow.appendChild(bc);
  }
  function updateRot() { /* reserved for future selected-state UI */ }

  function buildFrames() {
    var add = btn('+ Frame'); add.onclick = function () {
      var f = { objects: [] }, src = frame(), i;
      for (i = 0; i < src.objects.length; i++) f.objects.push(cloneShallow(src.objects[i]));
      // deep copy free-draw point arrays so frames stay independent
      for (i = 0; i < f.objects.length; i++) if (f.objects[i].t === 'free') {
        var p = [], j; for (j = 0; j < src.objects[i].pts.length; j++) p.push({ x: src.objects[i].pts[j].x, y: src.objects[i].pts[j].y });
        f.objects[i].pts = p;
      }
      state.frames.splice(frameIdx + 1, 0, f); frameIdx++;
      draw(); updateFrameInfo(); persist();
    };
    var prev = btn('&#9664;'); prev.onclick = function () { if (frameIdx > 0) { frameIdx--; selectedId = null; draw(); updateFrameInfo(); persist(); } };
    var next = btn('&#9654;'); next.onclick = function () { if (frameIdx < state.frames.length - 1) { frameIdx++; selectedId = null; draw(); updateFrameInfo(); persist(); } };
    var del = btn('Delete'); del.onclick = function () {
      if (state.frames.length <= 1) { state.frames = [newFrame()]; frameIdx = 0; }
      else { state.frames.splice(frameIdx, 1); if (frameIdx >= state.frames.length) frameIdx = state.frames.length - 1; }
      selectedId = null; draw(); updateFrameInfo(); persist();
    };
    playBtn = btn('Play'); playBtn.onclick = function () { if (playTimer) stopPlay(); else play(); };
    frameInfo = document.createElement('span'); frameInfo.id = 'frameInfo';
    frameRow.appendChild(prev);
    frameRow.appendChild(frameInfo);
    frameRow.appendChild(next);
    frameRow.appendChild(add);
    frameRow.appendChild(del);
    frameRow.appendChild(playBtn);
  }
  function updateFrameInfo() {
    if (frameInfo) frameInfo.innerHTML = ' ' + (frameIdx + 1) + ' / ' + state.frames.length + ' ';
  }

  function buildFile() {
    var reset = btn('Reset'); reset.onclick = function () {
      state.frames = [newFrame()]; frameIdx = 0; selectedId = null; stopPlay();
      draw(); updateFrameInfo(); persist();
    };
    var clear = btn('Clear frame'); clear.onclick = function () {
      frame().objects = []; selectedId = null; draw(); persist();
    };
    var snap = btn('Snapshot'); snap.onclick = function () { snapshot(); };
    fileRow.appendChild(reset);
    fileRow.appendChild(clear);
    fileRow.appendChild(snap);
  }

  function snapshot() {
    var box = document.getElementById('snap');
    try {
      var url = cv.toDataURL('image/png');
      box.innerHTML = '<p>Press and hold the image to save it to your Photos.</p>';
      var img = document.createElement('img');
      img.src = url; box.appendChild(img);
    } catch (e) {
      box.innerHTML = '<p>Snapshot is not supported on this device.</p>';
    }
  }

  // ---------- init ----------
  if (!restore()) { state.frames = [newFrame()]; frameIdx = 0; }
  buildSports();
  buildTools();
  buildProps();
  buildRot();
  buildFrames();
  buildFile();
  updatePropRow();
  updateFrameInfo();
  draw();
})();
</script>

<script>
/*
  Classic modules — squad, matches, live scouting, statistics, training,
  opponents, reports and data transfer. ES5 only (var, function expressions,
  onclick handlers, localStorage, no JSON download), so the original iPad and
  2010-era Chrome can run the whole coaching workflow, not just the board.
  Record shapes and the export envelope match the modern app, so a backup made
  here imports straight into SportTactic and the other way round.
*/
(function () {
  var KEY = 'stx_classic_v1';
  var D = { teams: [], players: [], staff: [], matches: [], events: [], sessions: [], drills: [], opponents: [] };
  // Classic store name -> modern app store name (used by export/import).
  var MAP = { teams: 'teams', players: 'players', staff: 'coaches', matches: 'matches', events: 'events', sessions: 'training', drills: 'exercises', opponents: 'opponents' };
  // The modern app filters players, staff, matches, training and opponents by
  // teamId, so every record here carries the one team this iPad owns.
  var SCOPED = ['players', 'staff', 'matches', 'sessions', 'opponents'];
  var SPORT_IDS = ['handball', 'soccer', 'basketball', 'volleyball'];

  var POS = ['Goalkeeper', 'Left Wing', 'Left Back', 'Centre Back', 'Pivot', 'Right Back', 'Right Wing', 'Player'];
  var STATUS = ['active', 'injured', 'suspended'];
  var STATUS_LBL = { active: 'Active', injured: 'Injured', suspended: 'Not active' };
  var MTYPE = ['League', 'Cup', 'Friendly', 'Tournament'];
  var MSTATUS = ['scheduled', 'live', 'finished'];
  var FOCUS = ['Warm-up', 'Attack', 'Defense', 'Goalkeeper', 'Conditioning', 'Physical', 'Set Plays'];
  var CATS = ['Attack', 'Defense', 'Goalkeeper', 'Conditioning', 'Set Plays'];
  var INT = ['Low', 'Medium', 'High'];

  // [type, label, result] — type/result strings match the modern app so the
  // same events feed the same statistics on both builds.
  var EVENTS = {

  // ---------- live scouting ----------

  function renderScout() {
    var v = g('v-scout'), list = sortedMatches(), i, h, p, ev, defs, k;
    if (!scMatch && list.length) scMatch = list[0].id;
    h = '<div class="card"><h2>Live scouting</h2>';
    if (!list.length) {
      v.innerHTML = h + '<p class="empty">Add a match first, then log events against it.</p></div>';

    }
    h += '<div class="frow"><div class="f half"><label class="fl">Match</label><select id="scMatch">';

    h += '<h3>Player</h3><div>';
    for (i = 0; i < D.players.length; i++) {

    if (def[2] === 'goal') {
      var m = find(D.matches, scMatch);

    }

  }

  // ---------- statistics ----------
  function countEvents(list, test) { var n = 0, i; for (i = 0; i < list.length; i++) { if (test(list[i])) n++; } return n; }
  function statsFor(list) {
    var goals = countEvents(list, function (e) { return e.result === 'goal'; });
    var shots = countEvents(list, function (e) { return e.category === 'attack' && (e.result === 'goal' || e.result === 'miss' || e.result === 'save'); });
    return {
      goals: goals, shots: shots,
      assists: countEvents(list, function (e) { return e.type === 'Assist'; }),
      turnovers: countEvents(list, function (e) { return e.category === 'turnover'; }),
      saves: countEvents(list, function (e) { return e.type === 'Save' || e.type === 'Penalty Save'; }),
      pct: shots ? Math.round(goals / shots * 100) : 0
    };
  }
  function eventsOf(playerId) {
    var out = [], i;
    for (i = 0; i < D.events.length; i++) { if (D.events[i].playerId === playerId) out.push(D.events[i]); }
    return out;
  }
  function renderStats() {
    var v = g('v-stats'), s = statsFor(D.events), i, p, ps, rows = [];
    var won = 0, lost = 0, drew = 0, m, us, them;
    for (i = 0; i < D.matches.length; i++) {
      m = D.matches[i];
      if (m.status !== 'finished') continue;
      us = m.home === false ? (m.awayScore || 0) : (m.homeScore || 0);
      them = m.home === false ? (m.homeScore || 0) : (m.awayScore || 0);
      if (us > them) won++; else if (us < them) lost++; else drew++;
    }
    var h = '<div class="card"><h2>Season</h2><div class="kpis">' +
      '<div class="kpi"><div><b>' + won + '</b><span>Won</span></div></div>' +
      '<div class="kpi"><div><b>' + drew + '</b><span>Drawn</span></div></div>' +
      '<div class="kpi"><div><b>' + lost + '</b><span>Lost</span></div></div>' +
      '<div class="kpi"><div><b>' + s.goals + '</b><span>Goals</span></div></div>' +
      '<div class="kpi"><div><b>' + s.shots + '</b><span>Shots</span></div></div>' +
      '<div class="kpi"><div><b>' + s.pct + '%</b><span>Shot %</span></div></div>' +
      '<div class="kpi"><div><b>' + s.assists + '</b><span>Assists</span></div></div>' +
      '<div class="kpi"><div><b>' + s.turnovers + '</b><span>Turnovers</span></div></div>' +
      '</div></div>';

    for (i = 0; i < D.players.length; i++) {
      p = D.players[i];
      ps = statsFor(eventsOf(p.id));
      rows.push({ p: p, s: ps });
    }
    rows.sort(function (a, b) { return b.s.goals - a.s.goals; });
    h += '<div class="card"><h2>Leaderboard</h2><table class="tbl">' +
      '<tr><th>#</th><th>Player</th><th class="r">Goals</th><th class="r">Shot %</th><th class="r">Assists</th><th class="r">Saves</th><th class="r">Turnovers</th></tr>';
    if (!rows.length) h += '<tr><td colspan="7" class="empty">No players yet.</td></tr>';
    for (i = 0; i < rows.length; i++) {
      h += '<tr><td>' + esc(rows[i].p.number || '') + '</td><td>' + esc(name(rows[i].p)) + '</td>' +
        '<td class="r">' + rows[i].s.goals + '</td><td class="r">' + rows[i].s.pct + '%</td>' +
        '<td class="r">' + rows[i].s.assists + '</td><td class="r">' + rows[i].s.saves + '</td>' +
        '<td class="r">' + rows[i].s.turnovers + '</td></tr>';
    }
    h += '</table></div>';
    v.innerHTML = h;
  }

  // ---------- training ----------
  var tEdit = null, dEdit = null;
  function renderTraining() {
    var v = g('v-training'), i, s, d, h, j, ex;
    var list = D.sessions.slice(0);
    list.sort(function (a, b) { return (a.date || 0) - (b.date || 0); });
    h = '<div class="card"><h2>Training sessions</h2><table class="tbl">' +
      '<tr><th>Date</th><th>Title</th><th>Focus</th><th class="r">Min</th><th class="r">&nbsp;</th></tr>';
    if (!list.length) h += '<tr><td colspan="5" class="empty">No sessions yet.</td></tr>';
    for (i = 0; i < list.length; i++) {
      s = list[i];
      h += '<tr><td>' + fmtDate(s.date) + '</td><td>' + esc(s.title || '') + '</td><td>' + esc(s.focus || '') +
        '</td><td class="r">' + (s.duration || 0) + '</td><td class="r">' +
        '<span class="b" data-tshow="' + s.id + '">Show</span> <span class="b" data-tedit="' + s.id + '">Edit</span> ' +
        '<span class="b" data-tdel="' + s.id + '">Delete</span></td></tr>';
    }
    h += '</table><div class="acts"><span class="b wide" data-tnew="1">+ Add session</span></div>';
    h += (tEdit ? sessionForm(tEdit) : '') + '</div>';

    h += '<div class="card"><h2>Drill library</h2><table class="tbl">' +
      '<tr><th>Drill</th><th>Category</th><th class="r">Min</th><th>Intensity</th><th class="r">&nbsp;</th></tr>';
    if (!D.drills.length) h += '<tr><td colspan="5" class="empty">No drills yet.</td></tr>';
    for (i = 0; i < D.drills.length; i++) {
      d = D.drills[i];
      h += '<tr><td>' + esc(d.title || '') + '</td><td>' + esc(d.category || '') + '</td>' +
        '<td class="r">' + (d.duration || 0) + '</td><td>' + esc(d.intensity || '') + '</td><td class="r">' +
        '<span class="b" data-dedit="' + d.id + '">Edit</span> <span class="b" data-ddel="' + d.id + '">Delete</span></td></tr>';
    }
    h += '</table><div class="acts"><span class="b wide" data-dnew="1">+ Add drill</span></div>';
    h += (dEdit ? drillForm(dEdit) : '') + '</div>';
    v.innerHTML = h;

    bind(v, 'data-tnew', function () { tEdit = { date: (new Date()).getTime(), duration: 90, exercises: [] }; dEdit = null; renderTraining(); });
    bind(v, 'data-tedit', function (id) { tEdit = find(D.sessions, id); dEdit = null; renderTraining(); });
    bind(v, 'data-tdel', function (id) { if (!confirmDel('session')) return; drop(D.sessions, id); tEdit = null; save(); renderTraining(); });
    bind(v, 'data-tcancel', function () { tEdit = null; renderTraining(); });
    bind(v, 'data-tshow', function (id) { showSession(find(D.sessions, id)); });
    bind(v, 'data-tsave', function () {
      var s = tEdit.id ? tEdit : {}, box = g('f_tex'), picked = [], i;
      s.title = val('f_ttl'); s.date = parseDate(val('f_tdate')) || (new Date()).getTime();
      s.duration = num(val('f_tdur')); s.focus = val('f_tfocus');
      s.teamId = teamId();
      if (box) { for (i = 0; i < box.options.length; i++) { if (box.options[i].selected) picked.push(box.options[i].value); } s.exercises = picked; }
      if (!s.title) { alert('Enter a title.'); return; }
      if (!s.id) { s.id = uid(); D.sessions.push(s); }
      save(); tEdit = null; renderTraining();
    });
    bind(v, 'data-dnew', function () { dEdit = { duration: 15, intensity: 'Medium' }; tEdit = null; renderTraining(); });
    bind(v, 'data-dedit', function (id) { dEdit = find(D.drills, id); tEdit = null; renderTraining(); });
    bind(v, 'data-ddel', function (id) { if (!confirmDel('drill')) return; drop(D.drills, id); dEdit = null; save(); renderTraining(); });
    bind(v, 'data-dcancel', function () { dEdit = null; renderTraining(); });
    bind(v, 'data-dsave', function () {
      var d = dEdit.id ? dEdit : {};
      d.title = val('f_dttl'); d.category = val('f_dcat'); d.duration = num(val('f_ddur'));
      d.intensity = val('f_dint'); d.description = val('f_ddesc');
      if (!d.title) { alert('Enter a title.'); return; }
      if (!d.id) { d.id = uid(); D.drills.push(d); }
      save(); dEdit = null; renderTraining();
    });
  }
  function sessionForm(s) {
    var h = '<div class="card"><h3>' + (s.id ? 'Edit session' : 'New session') + '</h3><div class="frow">' +
      fld('Title', 'f_ttl', s.title || '', 'half') +
      fld('Date (YYYY-MM-DD)', 'f_tdate', fmtDate(s.date) === '\u2014' ? today() : fmtDate(s.date), 'half') +
      fld('Duration (min)', 'f_tdur', s.duration || 90, 'half') +
      sel('Focus', 'f_tfocus', FOCUS, s.focus || 'Warm-up', 'half') +
      '<div class="f"><label class="fl">Drills (tap to select several)</label><select id="f_tex" multiple size="5">';
    var picked = s.exercises || [], i, j, on;
    for (i = 0; i < D.drills.length; i++) {
      on = false;
      for (j = 0; j < picked.length; j++) { if (picked[j] === D.drills[i].id) on = true; }
      h += '<option value="' + esc(D.drills[i].id) + '"' + (on ? ' selected' : '') + '>' + esc(D.drills[i].title) + '</option>';
    }
    if (!D.drills.length) h += '<option value="" disabled>Add drills below first</option>';
    h += '</select></div></div><div class="acts"><span class="b wide on" data-tsave="1">Save</span> ' +
      '<span class="b" data-tcancel="1">Cancel</span></div></div>';
    return h;
  }
  function drillForm(d) {
    return '<div class="card"><h3>' + (d.id ? 'Edit drill' : 'New drill') + '</h3><div class="frow">' +
      fld('Title', 'f_dttl', d.title || '', 'half') +
      sel('Category', 'f_dcat', CATS, d.category || 'Attack', 'half') +
      fld('Duration (min)', 'f_ddur', d.duration || 15, 'half') +
      sel('Intensity', 'f_dint', INT, d.intensity || 'Medium', 'half') +
      area('Description', 'f_ddesc', d.description || '') +
      '</div><div class="acts"><span class="b wide on" data-dsave="1">Save</span> ' +
      '<span class="b" data-dcancel="1">Cancel</span></div></div>';
  }
  function showSession(s) {
    if (!s) return;
    var lines = [s.title, fmtDate(s.date) + ' \u00b7 ' + (s.duration || 0) + ' min \u00b7 ' + (s.focus || ''), ''], i, d;
    var picked = s.exercises || [];
    for (i = 0; i < picked.length; i++) {
      d = find(D.drills, picked[i]);
      if (d) lines.push('\u2022 ' + d.title + ' (' + (d.duration || 0) + ' min, ' + (d.intensity || '') + ')' + (d.description ? '\n   ' + d.description : ''));
    }
    if (!picked.length) lines.push('No drills picked.');
    alert(lines.join('\n'));
  }

  // ---------- opponents ----------
  var oEdit = null;
  function renderOpp() {
    var v = g('v-opp'), i, o;
    var h = '<div class="card"><h2>Opponent analysis</h2><table class="tbl">' +
      '<tr><th>Opponent</th><th>Formation</th><th class="r">&nbsp;</th></tr>';
    if (!D.opponents.length) h += '<tr><td colspan="3" class="empty">No opponents scouted yet.</td></tr>';
    for (i = 0; i < D.opponents.length; i++) {
      o = D.opponents[i];
      h += '<tr><td>' + esc(o.name || '') + '</td><td>' + esc(o.formation || '') + '</td><td class="r">' + rowBtns(o.id) + '</td></tr>';
      if (o.keyPlayers || o.tendencies) {
        h += '<tr><td colspan="3">' + (o.keyPlayers ? '<div class="hint">Key players: ' + esc(o.keyPlayers) + '</div>' : '') +
          (o.tendencies ? '<div class="hint">' + esc(o.tendencies) + '</div>' : '') + '</td></tr>';
      }
    }
    h += '</table><div class="acts"><span class="b wide" data-new="1">+ Add opponent</span></div>';
    if (oEdit) {
      h += '<div class="card"><h3>' + (oEdit.id ? 'Edit opponent' : 'New opponent') + '</h3><div class="frow">' +
        fld('Name', 'f_oname', oEdit.name || '', 'half') +
        fld('Formation', 'f_oform', oEdit.formation || '', 'half') +
        fld('Key players', 'f_okey', oEdit.keyPlayers || '') +
        area('Tendencies', 'f_otend', oEdit.tendencies || '') +
        '</div><div class="acts"><span class="b wide on" data-osave="1">Save</span> ' +
        '<span class="b" data-ocancel="1">Cancel</span></div></div>';
    }
    v.innerHTML = h + '</div>';

    bind(v, 'data-new', function () { oEdit = {}; renderOpp(); });
    bind(v, 'data-edit', function (id) { oEdit = find(D.opponents, id); renderOpp(); });
    bind(v, 'data-del', function (id) { if (!confirmDel('opponent')) return; drop(D.opponents, id); oEdit = null; save(); renderOpp(); });
    bind(v, 'data-ocancel', function () { oEdit = null; renderOpp(); });
    bind(v, 'data-osave', function () {
      var o = oEdit.id ? oEdit : {};
      o.name = val('f_oname'); o.formation = val('f_oform');
      o.keyPlayers = val('f_okey'); o.tendencies = val('f_otend');
      o.teamId = teamId();
      if (!o.name) { alert('Enter a name.'); return; }
      if (!o.id) { o.id = uid(); D.opponents.push(o); }
      save(); oEdit = null; renderOpp();
    });
  }

  // ---------- reports ----------
  function renderReports() {
    var v = g('v-reports'), i, p, s, m, ps;
    var h = '<div class="card"><h2>Team report</h2>' +
      '<p class="hint">Everything on this iPad in one page. Use Print to send it to AirPrint or to save a PDF.</p>' +
      '<div class="acts"><span class="b wide" data-print="1">Print</span></div></div>';

    s = statsFor(D.events);
    h += '<div class="card"><h3>Season totals</h3><table class="tbl">' +
      '<tr><td>Matches</td><td class="r">' + D.matches.length + '</td></tr>' +
      '<tr><td>Goals</td><td class="r">' + s.goals + '</td></tr>' +
      '<tr><td>Shots</td><td class="r">' + s.shots + ' (' + s.pct + '%)</td></tr>' +
      '<tr><td>Assists</td><td class="r">' + s.assists + '</td></tr>' +
      '<tr><td>Saves</td><td class="r">' + s.saves + '</td></tr>' +
      '<tr><td>Turnovers</td><td class="r">' + s.turnovers + '</td></tr></table></div>';

    h += '<div class="card"><h3>Squad</h3><table class="tbl">' +
      '<tr><th>#</th><th>Name</th><th>Position</th><th>Status</th><th class="r">Goals</th></tr>';
    for (i = 0; i < D.players.length; i++) {
      p = D.players[i]; ps = statsFor(eventsOf(p.id));
      h += '<tr><td>' + esc(p.number || '') + '</td><td>' + esc(name(p)) + '</td><td>' + esc(p.position || '') +
        '</td><td>' + esc(STATUS_LBL[p.status || 'active']) + '</td><td class="r">' + ps.goals + '</td></tr>';
    }
    if (!D.players.length) h += '<tr><td colspan="5" class="empty">No players.</td></tr>';
    h += '</table></div>';

    h += '<div class="card"><h3>Matches</h3><table class="tbl">' +
      '<tr><th>Date</th><th>Opponent</th><th>Score</th><th>Status</th></tr>';
    var list = sortedMatches();
    for (i = 0; i < list.length; i++) {
      m = list[i];
      h += '<tr><td>' + fmtDate(m.date) + '</td><td>' + (m.home ? 'vs ' : '@ ') + esc(m.opponent || '') +
        '</td><td>' + score(m) + '</td><td>' + esc(m.status || '') + '</td></tr>';
    }
    if (!list.length) h += '<tr><td colspan="4" class="empty">No matches.</td></tr>';
    h += '</table></div>';

    h += '<div class="card"><h3>Training</h3><table class="tbl">' +
      '<tr><th>Date</th><th>Title</th><th>Focus</th><th class="r">Min</th></tr>';
    for (i = 0; i < D.sessions.length; i++) {
      h += '<tr><td>' + fmtDate(D.sessions[i].date) + '</td><td>' + esc(D.sessions[i].title || '') +
        '</td><td>' + esc(D.sessions[i].focus || '') + '</td><td class="r">' + (D.sessions[i].duration || 0) + '</td></tr>';
    }
    if (!D.sessions.length) h += '<tr><td colspan="4" class="empty">No sessions.</td></tr>';
    h += '</table></div>';
    v.innerHTML = h;
    bind(v, 'data-print', function () { window.print(); });
  }

  // ---------- data transfer ----------
  function buildDump() {
    stamp();
    var out = { app: 'SportTactic', format: 2, exportedAt: (new Date()).toString(), source: 'classic', stores: [], data: {} }, k;
    for (k in MAP) { if (MAP.hasOwnProperty(k)) { out.stores.push(MAP[k]); out.data[MAP[k]] = D[k]; } }
    return out;
  }
  function renderData() {
    var v = g('v-data'), k, n = 0;
    for (k in D) { if (D.hasOwnProperty(k)) n += D[k].length; }
    var h = '<div class="card"><h2>Backup &amp; transfer</h2>' +
      '<p class="hint">' + n + ' records are stored on this iPad. Older iPads cannot download files, so the backup is plain text: ' +
      'select it all, copy it and mail it to yourself. The same text pastes into SportTactic on a newer device under ' +
      'Settings &rsaquo; Import Backup, and a backup from a newer device pastes in here.</p>' +
      '<div class="acts"><span class="b wide" data-export="1">Show backup text</span> ' +
      '<span class="b wide" data-import="1">Import pasted text</span> ' +
      '<span class="b" data-selall="1">Select all</span> ' +
      '<span class="b red" data-reset="1">Erase all data</span></div>' +
      '<div class="f"><label class="fl">Backup text</label><textarea id="dataBox"></textarea></div>' +
      '<p class="hint" id="dataMsg"></p></div>';
    h += '<div class="card"><h2>About this build</h2>' +
      '<p class="hint">This is the classic build for iPads from 2010 and other browsers without IndexedDB or modern JavaScript. ' +
      'It stores everything in this browser only \u2014 no account, no server, no internet needed. ' +
      'A newer device should use the <a class="full" href="index.html?full=1">full version</a>, which adds video analysis, ' +
      'AI assistance, e-mail and the encrypted messenger. Opening this page again always brings you back here, ' +
      'and index.html?classic=1 forces the classic build on any device.</p></div>';
    v.innerHTML = h;

    bind(v, 'data-export', function () {
      g('dataBox').value = JSON.stringify(buildDump());
      g('dataMsg').innerHTML = 'Backup ready. Tap Select all, then Copy.';
    });
    bind(v, 'data-selall', function () { var b = g('dataBox'); b.focus(); b.select(); });
    bind(v, 'data-import', function () {
      var txt = g('dataBox').value, dump, src, k, rows;
      if (!txt) { g('dataMsg').innerHTML = 'Paste a backup into the box first.'; return; }
      try { dump = JSON.parse(txt); } catch (e) { g('dataMsg').innerHTML = 'That is not a readable backup.'; return; }
      src = dump && dump.data ? dump.data : dump;
      if (!src || typeof src !== 'object') { g('dataMsg').innerHTML = 'That is not a readable backup.'; return; }
      if (!window.confirm('Replace everything on this iPad with the pasted backup?')) return;
      var got = 0;
      for (k in MAP) {
        if (!MAP.hasOwnProperty(k)) continue;
        rows = src[MAP[k]] || src[k];
        if (rows && rows.length !== undefined) { D[k] = rows; got += rows.length; }
      }
      save();
      g('dataMsg').innerHTML = got + ' records imported.';
      renderAll();
    });
    bind(v, 'data-reset', function () {
      if (!window.confirm('Erase every player, match, session and event on this iPad?')) return;
      var k;
      for (k in D) { if (D.hasOwnProperty(k)) D[k] = []; }
      save(); renderAll(); g('dataMsg').innerHTML = 'All data erased.';
    });
  }

  // ---------- shell ----------
  var VIEWS = {
    squad: renderSquad, matches: renderMatches, scout: renderScout, stats: renderStats,
    training: renderTraining, opp: renderOpp, reports: renderReports, data: renderData
  };
  function renderAll() {
    var k;
    for (k in VIEWS) { if (VIEWS.hasOwnProperty(k)) VIEWS[k](); }
  }
  function show(id) {
    var views = document.querySelectorAll('.view'), tabs = document.querySelectorAll('.tab'), i;
    for (i = 0; i < views.length; i++) views[i].className = 'view' + (views[i].id === 'v-' + id ? ' on' : '');
    for (i = 0; i < tabs.length; i++) tabs[i].className = 'tab' + (tabs[i].getAttribute('data-view') === id ? ' on' : '');
    if (VIEWS[id]) VIEWS[id]();
    try { localStorage.setItem('stx_classic_tab', id); } catch (e) {}
    window.scrollTo(0, 0);
  }

  load();
  ensureTeam();
  // Landing here again clears the "always use the full version" override, so a
  // device that cannot run the modern app can never get stuck on it.
  try { localStorage.removeItem('stx_force_full'); } catch (e) {}
  renderAll();
  bind(document.getElementById('tabs'), 'data-view', function (id) { show(id); });
  var last = '';
  try { last = localStorage.getItem('stx_classic_tab') || ''; } catch (e) {}
  if (last && (last === 'board' || VIEWS[last])) show(last);
})();
</script>
</body>
</html>
