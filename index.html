  <meta charset="UTF-8" />
  <!-- Content-Security-Policy. There is no server to set headers on (the app is
       static hosting), so it lives here and must therefore be the first thing in
       <head> — a meta policy only governs what is loaded after it.

       script-src and connect-src are the two that actually stop an attacker:
       the first means injected markup cannot pull code from anywhere but the
       hosts below, the second means nothing on this page can post the squad,
       the Drive key or a team code to an address that is not listed. Keep both
       tight. img/media/frame stay broader on purpose: a coach may paste a link
       to any club's video or image, and neither can execute code.

       'unsafe-inline' is required by the inline blocks this file still needs
       (the legacy gate must run before any external file is fetched). Moving
       them out and switching to hashes is the next step if a build is ever
       added — until then treat the escaping in ui.js as the XSS defence and
       this policy as the second line.

       WHEN ADDING A THIRD-PARTY SERVICE, ADD ITS ORIGIN HERE OR IT WILL BE
       BLOCKED AT RUNTIME WITH NOTHING BUT A CONSOLE MESSAGE.
         googletagmanager / google-analytics  analytics
         paypalobjects / paypal               donate button
         accounts.google.com                  Google sign-in (GIS)
         googleapis.com                       Drive API (shared team database)
         drive.google.com                     Drive file preview
         api.openai.com                       AI assistant
         api.emailjs.com                      sending mail
         cdn.jsdelivr.net                      PeerJS (messenger)
         *.peerjs.com                          PeerJS signalling
         youtube / ytimg                      video embeds and thumbnails -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.paypalobjects.com https://*.paypal.com https://accounts.google.com https://apis.google.com https://cdn.jsdelivr.net;
    connect-src 'self' blob: data: https://www.googleapis.com https://accounts.google.com https://api.openai.com https://api.emailjs.com https://www.youtube.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.paypal.com https://*.peerjs.com wss://*.peerjs.com;
    img-src 'self' data: blob: https:;
    media-src 'self' data: blob: https:;
    frame-src 'self' https:;
    style-src 'self' 'unsafe-inline';
    font-src 'self' data:;
    worker-src 'self';
    manifest-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'self' https://*.paypal.com;
    upgrade-insecure-requests" />
  <!-- Keep the address out of third-party logs: it has carried a team code. -->
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <!-- Transport and framing guard. Runs before the legacy gate and before any
       app code, so a framed or plain-http copy is dealt with before it can be
       shown anything or handed anything. ES3 only — the oldest devices reach
       this line too. -->
  <script>
    (function () {
      var l = window.location;
      var dev = l.hostname === 'localhost' || l.hostname === '127.0.0.1' || l.protocol === 'file:';
      // frame-ancestors cannot be set from a meta CSP, so clickjacking is
      // handled here. If the parent refuses to be navigated, blanking our own
      // frame is always allowed and leaves the attacker with nothing.
      if (window.top !== window.self && !dev) {
        try { window.top.location.replace(l.href); }
        catch (e) { l.replace('about:blank'); }
      }
      // Plain http would put the team code, the Drive API key and the whole
      // squad on the wire in the clear, and let anyone in the middle rewrite
      // the app itself.
      if (l.protocol === 'http:' && !dev) {
        l.replace('https://' + l.host + l.pathname + l.search + l.hash);
      }
    })();
  </script>
  <!-- Legacy-device gate. MUST stay ahead of every ES6 file and MUST stay ES3:
       an old iPad (iOS 3-6) or a 2010-era Chrome throws a SyntaxError on the ES6
       in the splash builder and the app modules, so the check has to run and
       redirect before any of that is parsed. Only the ES3 transport guard above
       may come first. ?full=1 forces the modern app, ?classic=1 the legacy one. -->
  <script>
    (function () {
      var q = String(window.location.search || '');
      function has(k) { return q.indexOf(k) >= 0; }
      if (has('full=1')) { try { localStorage.setItem('stx_force_full', '1'); } catch (e) {} return; }
      try { if (localStorage.getItem('stx_force_full') === '1') return; } catch (e) {}
      var legacy = has('classic=1');
      if (!legacy) {
        // Every feature the modern build hard-depends on.
        var ok = !!(window.indexedDB && window.Promise && window.JSON && Object.assign &&
          window.matchMedia && document.querySelector && document.documentElement.classList &&
          window.localStorage && Array.prototype.forEach && window.CustomEvent);
        // ES6 syntax support — an old parser cannot even read the app files.
        // Only a real SyntaxError means "old parser". The Content-Security-Policy
        // above forbids eval, so a modern browser throws an EvalError here
        // instead — treating that as legacy would send everyone to the classic
        // page.
        if (ok) {
          try { new Function('var f=(a)=>`${a}`;class C{};let x=0;'); }
          catch (e) { if (e instanceof SyntaxError) ok = false; }
        }
        // Original iPad / early iOS report these; they pass some checks above.
        var ua = navigator.userAgent || '';
        if (ok && /\((iPad|iPhone|iPod)[^)]*OS ([1-9]|10)_/.test(ua)) ok = false;
        legacy = !ok;
      }
      if (legacy) window.location.replace('oldipads.html');
    })();
  </script>

    /* Boot splash — inline so it paints before styles.css / the app scripts run.
       Always dark: the saved theme lives in IndexedDB and cannot be read synchronously. */
    #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
      background:radial-gradient(900px 620px at 50% 40%,#1a1a1a,#000 70%),#000;color:#fff;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-align:center;
      padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
      -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;cursor:pointer;
      transition:opacity .55s ease,visibility .55s}
    #splash.done{opacity:0;visibility:hidden;pointer-events:none}
    #splashArt{width:min(70vw,58vh,430px);height:auto;overflow:visible}
    .sp-name{font-family:'Race Sport',"Arial Black","Arial Bold","Helvetica Neue",Arial,Gadget,sans-serif;

      background:linear-gradient(90deg,#fff,#8c8c8c 50%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
    .sp-sub{font-size:clamp(9px,2.2vw,12px);letter-spacing:.3em;color:#8a8a8a;text-transform:uppercase}
    .sp-bar{width:min(280px,60vw);height:4px;border-radius:4px;background:#1e1e1e;overflow:hidden}
    .sp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#555,#fff);animation:spFill 5s linear forwards}
    .sp-chip{opacity:0;animation:spIn .5s ease-out forwards}
    .sp-orbit{transform-origin:230px 230px;animation:spSpin 9s linear infinite}
    .sp-orbit.rev{animation-duration:26s;animation-direction:reverse}
    .sp-pulse{transform-origin:230px 230px;animation:spPulse 2.4s ease-in-out infinite}
    @keyframes spFill{to{width:100%}}
    @keyframes spIn{to{opacity:1}}
    @keyframes spSpin{to{transform:rotate(360deg)}}
    @keyframes spPulse{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:.25;transform:scale(1.08)}}
    @media (prefers-reduced-motion:reduce){
      .sp-orbit,.sp-pulse{animation:none}
      .sp-chip{animation-duration:.2s;animation-delay:0s!important}
    }
  </style>
